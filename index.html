<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumpscare Quiz</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="quiz-screen" id="quizScreen">
            <div class="quiz-header">
                <h1>🧠 Jumpscare Quiz Challenge</h1>
                <p>Answer the questions... if you dare! 😈</p>
            </div>

            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>

            <div class="question-container">
                <div class="question-number" id="questionNumber"></div>
                <h2 id="question"></h2>
                
                <div class="options" id="options"></div>
                
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
            </div>
        </div>

        <div class="scare-overlay hidden" id="scareOverlay">
            <div class="scare-content">
                <img id="scareImage" src="" alt="jumpscare" />
                <div class="scare-message" id="scareMessage">GOTCHA!</div>
                <audio id="scareAudio" autoplay>
                    <source src="" type="audio/mpeg">
                </audio>
            </div>
        </div>

        <div class="result-screen hidden" id="resultScreen">
            <h1>Quiz Complete! 🎉</h1>
            <div class="score">
                <h2 id="scoreText"></h2>
                <p id="feedbackText"></p>
            </div>
            <button onclick="restartQuiz()" class="restart-btn">Take Quiz Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
